<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HAUNTED CAMCORDER — trailer compositor</title>
<!--
  Trailer compositor. render.js loads this page, calls renderFrame(i) for every frame
  (1920×1080 @ 30 fps) and renderAudio() once for the synthesized soundtrack, then
  hands both to ffmpeg. Everything here is drawn procedurally on a 2D canvas on top
  of in-engine footage captured by capture.js (cap/<shot>/0000.jpg …).
-->
<style>
  @font-face { font-family: Anton; src: url(fonts/Anton.ttf); }
  @font-face { font-family: Elite; src: url(fonts/SpecialElite.ttf); }
  @font-face { font-family: Corm; src: url(fonts/CormorantItalic.ttf); font-style: italic; }
  @font-face { font-family: Plex; src: url(fonts/PlexMono500.ttf); font-weight: 500; }
  @font-face { font-family: Plex; src: url(fonts/PlexMono700.ttf); font-weight: 700; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, FPS = 30, DUR = 64, FRAMES = DUR * FPS;
const URL_TEXT = 'hauntedcamcorder.netlify.app';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const A = mk(), B = mk(), C = mk(), T = mk();
const a2 = A.getContext('2d'), b2 = B.getContext('2d'), c2 = C.getContext('2d'), t2 = T.getContext('2d');

/* ── deterministic randomness (every render of a frame is identical) ── */
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
let _rs = 1; const rseed = (s) => { _rs = (s * 9301 + 49297) % 233280 || 1; }; const rnd = () => { _rs = (_rs * 9301 + 49297) % 233280; return _rs / 233280; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const eOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3), eIn = (k) => Math.pow(clamp(k, 0, 1), 3);
const eBack = (k) => { k = clamp(k, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const win = (t, a, b) => t >= a && t < b;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

/* ── footage ── */
const imgCache = new Map();
function frameSrc(shot, f) { return `cap/${shot}/${String(Math.max(0, f | 0)).padStart(4, '0')}.jpg`; }
function loadImg(src) {
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  imgCache.set(src, p);
  if (imgCache.size > 160) imgCache.delete(imgCache.keys().next().value);
  return p;
}
const SHOT_LEN = { foyer_push: 96, title_bg: 180, library_tape: 72, pale_woman: 84, doll: 72, gallery_hall: 60, gallery_mother: 66, crawler: 96, mother_glimpse: 90, mother_chase: 96, jump_mother: 26, rose_crib: 90, jump_rose: 24, door_slam: 75, kept: 132, lady: 96, below_nv: 96, stalker: 108, danny_corner: 90, rose_found: 72, jump_kept: 24 };

/* ── prebuilt texture layers ── */
const grain = []; for (let k = 0; k < 6; k++) { const g = mk(480, 270), gg = g.getContext('2d'), id = gg.createImageData(480, 270); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } gg.putImageData(id, 0, 0); grain.push(g); }
const scan = mk(W, H); { const s = scan.getContext('2d'); s.fillStyle = '#fff'; s.fillRect(0, 0, W, H); s.fillStyle = 'rgba(0,0,0,0.22)'; for (let y = 0; y < H; y += 4) s.fillRect(0, y, W, 2); }
const vig = mk(W, H); { const v = vig.getContext('2d'), g = v.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.95); g.addColorStop(0, '#fff'); g.addColorStop(0.7, '#b8b8b8'); g.addColorStop(1, '#141414'); v.fillStyle = g; v.fillRect(0, 0, W, H); }
const paper = mk(W, H); { const p = paper.getContext('2d'); p.fillStyle = '#ddd3b8'; p.fillRect(0, 0, W, H); const id = p.getImageData(0, 0, W, H); for (let i = 0; i < id.data.length; i += 4) { const n = (Math.random() - 0.5) * 22; id.data[i] += n; id.data[i + 1] += n; id.data[i + 2] += n * 0.8; } p.putImageData(id, 0, 0);
  const g = p.createRadialGradient(W * 0.3, H * 0.2, 50, W * 0.5, H * 0.5, W * 0.8); g.addColorStop(0, 'rgba(255,250,235,.35)'); g.addColorStop(1, 'rgba(90,60,25,.35)'); p.fillStyle = g; p.fillRect(0, 0, W, H);
  p.strokeStyle = 'rgba(120,90,50,.15)'; for (let i = 0; i < 40; i++) { p.lineWidth = Math.random() * 2; p.beginPath(); const x = Math.random() * W, y = Math.random() * H; p.moveTo(x, y); p.bezierCurveTo(x + 80, y + 30, x + 140, y - 20, x + 260, y + 10); p.stroke(); } }

/* ── VHS treatment: chroma bleed, scanlines, grain, vignette, tracking, slice glitches ── */
function vhsBlit(img, o = {}) {
  const { bright = 1, shake = 0, zoom = 1, chroma = 3, t = 0, nv = false } = o;
  a2.save(); a2.fillStyle = '#000'; a2.fillRect(0, 0, W, H);
  const sx = (hash(t * 91.3) - 0.5) * shake, sy = (hash(t * 37.7) - 0.5) * shake;
  const zw = W * zoom, zh = H * zoom;
  a2.filter = bright !== 1 ? `brightness(${bright})` : 'none';
  if (img) a2.drawImage(img, (W - zw) / 2 + sx, (H - zh) / 2 + sy, zw, zh);
  a2.restore();
  // chroma: G+B from the frame, R shifted
  b2.globalCompositeOperation = 'copy'; b2.drawImage(A, 0, 0); b2.globalCompositeOperation = 'multiply'; b2.fillStyle = '#ff0000'; b2.fillRect(0, 0, W, H);
  c2.globalCompositeOperation = 'copy'; c2.drawImage(A, 0, 0); c2.globalCompositeOperation = 'multiply'; c2.fillStyle = '#00ffff'; c2.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(C, 0, 0); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(B, chroma, 0); ctx.globalCompositeOperation = 'source-over';
}
function finishVHS(t, o = {}) {
  const { grainAmt = 0.14, glitch = 0, track = 0.35, scanAmt = 1, vigAmt = 1 } = o;
  // scanlines + vignette
  ctx.globalCompositeOperation = 'multiply';
  if (scanAmt) { ctx.globalAlpha = scanAmt; ctx.drawImage(scan, 0, 0); }
  if (vigAmt) { ctx.globalAlpha = vigAmt; ctx.drawImage(vig, 0, 0); }
  ctx.globalAlpha = 1;
  // grain
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = grainAmt;
  const gi = grain[Math.floor(t * FPS) % grain.length]; ctx.drawImage(gi, 0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // tracking band rolling down the frame
  const by = ((t * 0.09 + 0.3) % 1.2 - 0.1) * H;
  if (track > 0) { const g = ctx.createLinearGradient(0, by - 40, 0, by + 40); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${0.05 * track})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, by - 40, W, 80);
    rseed(Math.floor(t * 30) + 7); for (let i = 0; i < 18; i++) { const y = by - 30 + rnd() * 60; ctx.fillStyle = `rgba(255,255,255,${rnd() * 0.25 * track})`; ctx.fillRect(rnd() * W, y, 40 + rnd() * 300, 2); } }
  // slice glitch
  if (glitch > 0.01) {
    rseed(Math.floor(t * 30) * 13 + 3); const n = Math.floor(2 + glitch * 10);
    for (let i = 0; i < n; i++) { const y = rnd() * H, h = 4 + rnd() * 60 * glitch, dx = (rnd() - 0.5) * 160 * glitch; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }
    if (glitch > 0.4) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,0,60,${0.08 * glitch})`; ctx.fillRect(0, rnd() * H, W, 30 * glitch); ctx.globalCompositeOperation = 'source-over'; }
  }
}
function staticFrame(t, amt = 1) {
  const gi = grain[Math.floor(t * FPS * 3) % grain.length];
  ctx.globalAlpha = amt; ctx.drawImage(gi, (hash(t) - 0.5) * 60, (hash(t + 3) - 0.5) * 60, W + 60, H + 60); ctx.globalAlpha = 1;
  rseed(Math.floor(t * 30) + 99); for (let i = 0; i < 6; i++) { ctx.fillStyle = `rgba(0,0,0,${0.3 + rnd() * 0.4})`; ctx.fillRect(0, rnd() * H, W, 10 + rnd() * 60); }
}
function flash(a, col = '255,255,255') { if (a > 0.001) { ctx.fillStyle = `rgba(${col},${clamp(a, 0, 1)})`; ctx.fillRect(0, 0, W, H); } }
function black() { ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }

/* ── type ── */
function text(str, x, y, o = {}) {
  const { font = 'Anton', size = 120, weight = '', style = '', color = '#f2eee2', align = 'center', base = 'middle', alpha = 1, split = 0, track = 0, scale = 1, glow = 0, rot = 0 } = o;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = `${style} ${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = track + 'px';
  if (split > 0.2) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha * 0.85; ctx.fillStyle = '#ff1744'; ctx.fillText(str, -split, 0); ctx.fillStyle = '#00e5ff'; ctx.fillText(str, split, 0); ctx.globalCompositeOperation = 'source-over'; }
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function measure(str, font, size, track = 0, weight = '', style = '') { ctx.save(); ctx.font = `${style} ${weight} ${size}px ${font}`; ctx.letterSpacing = track + 'px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }
/* Typewriter: characters appear at cps; a block cursor blinks after the last one */
function typed(str, x, y, t0, t, o = {}) {
  const { cps = 26, font = 'Elite', size = 46, color = '#e9e2cf', align = 'center', cursor = true, track = 1 } = o;
  const n = clamp(Math.floor((t - t0) * cps), 0, str.length); if (t < t0) return 0;
  const shown = str.slice(0, n), full = measure(str, font, size, track);
  const left = align === 'center' ? x - full / 2 : x;
  rseed(n * 7 + 1);
  ctx.save(); ctx.font = `${size}px ${font}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.letterSpacing = track + 'px'; ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(255,40,70,.5)'; ctx.shadowOffsetX = -2; ctx.fillText(shown, left + (hash(t * 50) - 0.5) * 1.5, y);
  ctx.shadowColor = 'rgba(0,210,255,.4)'; ctx.shadowOffsetX = 2; ctx.fillText(shown, left, y);
  const cw = measure(shown, font, size, track);
  if (cursor && (Math.floor(t * 2.4) % 2 === 0 || n < str.length)) { ctx.shadowColor = 'transparent'; ctx.fillRect(left + cw + 6, y - size * 0.45, size * 0.5, size * 0.9); }
  ctx.restore(); return n;
}
/* Big kinetic slam: scale punch, RGB split decay, slice-glitch on the way in */
function slam(str, x, y, t0, t, o = {}) {
  if (t < t0) return; const k = t - t0, { size = 150, hold = 99, color = '#f2eee2', font = 'Anton', track = 4, out = 0.18 } = o;
  const inK = eOut(k / 0.22), outK = k > hold ? prog(t, t0 + hold, t0 + hold + out) : 0;
  const scale = lerp(1.35, 1, inK) * (1 + outK * 0.12), alpha = inK * (1 - outK), split = lerp(26, 3, eOut(k / 0.5)) + Math.sin(t * 40) * 1.2 + outK * 30;
  // render to the text buffer so it can be sliced
  t2.clearRect(0, 0, W, H);
  const save = ctx; // draw using the same helper on the offscreen context
  t2.save(); t2.translate(x, y); t2.scale(scale, scale); t2.font = `${size}px ${font}`; t2.textAlign = 'center'; t2.textBaseline = 'middle'; t2.letterSpacing = track + 'px';
  t2.globalCompositeOperation = 'lighter'; t2.globalAlpha = alpha * 0.9; t2.fillStyle = '#ff1744'; t2.fillText(str, -split, 0); t2.fillStyle = '#00e5ff'; t2.fillText(str, split, 0);
  t2.globalCompositeOperation = 'source-over'; t2.globalAlpha = alpha; t2.fillStyle = color; t2.fillText(str, 0, 0); t2.restore();
  const g = k < 0.25 ? 1 - k / 0.25 : outK;
  if (g > 0.02) { rseed(Math.floor(t * 30) * 5 + str.length); for (let i = 0; i < 9; i++) { const yy = y - size * 0.6 + rnd() * size * 1.2, hh = 6 + rnd() * 30, dx = (rnd() - 0.5) * 220 * g; save.drawImage(T, 0, yy, W, hh, dx, yy, W, hh); } }
  save.drawImage(T, 0, 0);
}
/* Wrapping for long rule lines */
function slamLines(lines, x, y, t0, t, o = {}) { const size = o.size || 110, gap = size * 1.02; lines.forEach((l, i) => slam(l, x, y + (i - (lines.length - 1) / 2) * gap, t0 + i * 0.08, t, o)); }

/* ── camcorder on-screen display ── */
function osd(t, o = {}) {
  const { tc = t, date = 'PM 11:58\nOCT 31 1998', rec = true, label = 'PLAY ►', alpha = 1, battery = 3 } = o;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = 'rgba(244,241,232,.85)'; ctx.lineWidth = 4;
  const m = 96, mt = 54, L = 90;
  for (const [x, y, dx, dy] of [[m, mt, 1, 1], [W - m, mt, -1, 1], [m, H - mt, 1, -1], [W - m, H - mt, -1, -1]]) { ctx.beginPath(); ctx.moveTo(x, y + dy * L); ctx.lineTo(x, y); ctx.lineTo(x + dx * L, y); ctx.stroke(); }
  const vt = (s, x, y, al = 'left', size = 34) => { ctx.font = `700 ${size}px Plex`; ctx.textAlign = al; ctx.textBaseline = 'top'; ctx.letterSpacing = '2px'; ctx.fillStyle = 'rgba(255,0,60,.55)'; ctx.fillText(s, x + 2, y); ctx.fillStyle = 'rgba(0,200,255,.45)'; ctx.fillText(s, x - 2, y); ctx.fillStyle = '#f4f1e8'; ctx.fillText(s, x, y); };
  if (rec && Math.floor(t * 1.6) % 2 === 0) { ctx.fillStyle = '#ff2a2a'; ctx.beginPath(); ctx.arc(m + 40, mt + 42, 13, 0, 7); ctx.fill(); }
  if (rec) vt('REC', m + 62, mt + 23);
  vt(label, m + 190, mt + 23); vt('SP', m + 28, mt + 70, 'left', 26);
  // battery
  ctx.strokeStyle = '#f4f1e8'; ctx.lineWidth = 4; ctx.strokeRect(W - m - 118, mt + 26, 80, 34); ctx.fillStyle = '#f4f1e8'; ctx.fillRect(W - m - 36, mt + 35, 7, 16);
  for (let i = 0; i < 4; i++) if (i < battery) ctx.fillRect(W - m - 113 + i * 19, mt + 31, 15, 24);
  const f = Math.floor((tc % 1) * 30), s = Math.floor(tc) % 60, mi = Math.floor(tc / 60) % 60;
  vt(`00:${String(mi).padStart(2, '0')}:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`, m + 28, H - mt - 70);
  const [d1 = '', d2 = ''] = (date || '').split('\n'); if (d1) vt(d1, W - m - 28, H - mt - 108, 'right'); if (d2) vt(d2, W - m - 28, H - mt - 66, 'right');
  ctx.restore();
}

/* ── the edit ── */
// footage segments: [start, end, shot, firstFrame, opts]
const SEG = [
  [6.4, 9.6, 'foyer_push', 0, { osd: 'd97', tc0: 12, dim: 1.45 }],
  [11.4, 12.4, 'library_tape', 22, { osd: 'd97', tc0: 1210 }],
  [12.4, 13.4, 'pale_woman', 34, { osd: 'd97', tc0: 1893 }],
  [13.4, 14.4, 'doll', 36, { osd: 'd97', tc0: 2511, zoomTo: 1.08 }],
  [14.4, 15.4, 'gallery_hall', 16, { osd: 'd97', tc0: 3077 }],
  [15.4, 17.4, 'gallery_mother', 6, { dim: 0.42, osd: null, zoomTo: 1.1 }],
  [17.4, 19.4, 'crawler', 30, { osd: 'd98', tc0: 3521 }],
  [19.4, 21.4, 'mother_glimpse', 30, { osd: 'd98', tc0: 4100 }],
  [21.4, 23.4, 'mother_chase', 36, { osd: 'd98', tc0: 4907, shake: 14 }],
  [25.8, 28.3, 'door_slam', 0, { osd: 'slam', tc0: 5566 }],
  [28.3, 29.7, 'kept', 26, { osd: 'd33', tc0: 5731 }],
  [29.7, 31.1, 'lady', 42, { osd: 'd33', tc0: 5998 }],
  [31.1, 32.5, 'below_nv', 42, { osd: 'd33', tc0: 6242, nv: true }],
  [32.5, 33.9, 'stalker', 60, { osd: 'd33', tc0: 6590 }],
  [33.9, 35.3, 'danny_corner', 44, { osd: 'd33', tc0: 6911 }],
  [35.3, 36.7, 'rose_found', 22, { osd: 'd33', tc0: 7303, zoomTo: 1.45 }],
  [41.6, 42.4, 'jump_mother', 0, { osd: null, shake: 60, zoomTo: 1.15 }]
];
const STROBE = ['kept', 'lady', 'crawler', 'mother_chase', 'stalker', 'below_nv', 'danny_corner', 'rose_crib', 'gallery_mother', 'jump_kept', 'mother_glimpse', 'jump_rose', 'doll', 'lady', 'kept', 'jump_kept'];
const DATES = { d97: 'PM 11:58\nOCT 31 1997', d98: 'AM 12:47\nOCT 31 1998', d33: 'AM 3:33\nOCT 31 1997' };
const RULES = [
  [17.4, ['KEEP RECORDING.']], [19.4, ['DON\'T LOOK AWAY.']], [21.4, ['KEEP HER', 'IN FRAME.']],
  [28.3, ['THEY MOVE WHEN', 'THE LIGHT IS OFF THEM.']], [29.7, ['SHE HUNTS BY SOUND.', 'DON\'T RUN.']], [31.1, ['IT ONLY SHOWS', 'IN THE GREEN.']],
  [32.5, ['ZOOM IN.', 'IT HATES BEING SEEN.']], [33.9, ['DON\'T LOOK', 'AT HIS FACE.']], [35.3, ['SHE ONLY', 'WANTS TO PLAY.']]
];
// hard cuts that get a flash + static tick
const CUTS = [6.4, 11.4, 12.4, 13.4, 14.4, 15.4, 17.4, 19.4, 21.4, 25.8, 28.3, 29.7, 31.1, 32.5, 33.9, 35.3, 36.7, 41.6, 43.2];

async function drawSeg(t, seg) {
  const [s, e, shot, f0, o] = seg, k = (t - s) / (e - s);
  const f = Math.min(SHOT_LEN[shot] - 1, f0 + Math.floor((t - s) * FPS));
  const img = await loadImg(frameSrc(shot, f));
  const zoom = o.zoomTo ? lerp(1, o.zoomTo, k) : 1.02;
  const cutK = CUTS.reduce((m, c) => Math.max(m, t >= c && t < c + 0.2 ? 1 - (t - c) / 0.2 : 0), 0);
  vhsBlit(img, { bright: o.dim || 1, shake: (o.shake || 3) + cutK * 30, zoom, chroma: 3 + cutK * 16, t });
  return cutK;
}

async function renderFrame(i) {
  const t = i / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  black();
  let glitch = 0, useVHS = false, osdO = null, cutK = 0;
  const seg = SEG.find((s) => t >= s[0] && t < s[1]);
  if (seg) { cutK = await drawSeg(t, seg); useVHS = true; glitch = cutK * 0.9; if (seg[4].osd) osdO = seg[4]; }

  // ── 0–6.4: the tape starts ──
  if (t < 6.4) {
    const st = t < 0.7 ? 1 - t / 0.7 : 0; if (st > 0) staticFrame(t, st * 0.8);
    osd(t, { rec: false, label: 'PLAY ►', date: '', alpha: t < 0.6 ? 0 : 1, battery: 4, tc: 0 });
    if (t >= 0.9 && t < 2.6) { const a = prog(t, 0.9, 1.2) * (1 - prog(t, 2.3, 2.6)); ctx.globalAlpha = a; typed('HOLLOWELL — PLAY ME', W / 2, H / 2 - 10, 0.95, t, { size: 58, cps: 18, font: 'Elite', color: '#efe7d2' });
      if (t > 2.0) { ctx.strokeStyle = '#c21a1a'; ctx.lineWidth = 5; ctx.beginPath(); const x0 = W / 2 + 250; ctx.moveTo(x0, H / 2 + 2); ctx.lineTo(x0 + 130 * prog(t, 2.0, 2.2), H / 2 - 4); ctx.stroke(); } ctx.globalAlpha = 1; }
    if (t >= 2.6) {
      typed('OCTOBER 31ST, 1997.', W / 2, H / 2 - 60, 2.75, t, { size: 52, cps: 22 });
      typed('MY BROTHER WALKED INTO HOLLOWELL MANOR', W / 2, H / 2 + 20, 3.75, t, { size: 44, cps: 30, cursor: t < 5.4 });
      typed('WITH A CAMCORDER.', W / 2, H / 2 + 84, 5.1, t, { size: 44, cps: 26 });
    }
    finishVHS(t, { grainAmt: 0.22, track: 0.8, glitch: t < 0.8 ? 0.6 : 0 });
  }
  // ── 6.4–9.6: the house ──
  if (win(t, 6.4, 9.6)) {
    slam('HE NEVER CAME OUT.', W / 2, H * 0.78, 7.7, t, { size: 118, hold: 1.7, track: 6 });
  }
  // ── 9.6–11.4: a tape in the mail ──
  if (win(t, 9.6, 11.4)) {
    if (t < 9.8) staticFrame(t, 1 - prog(t, 9.6, 9.8));
    typed('ONE YEAR LATER,', W / 2, H / 2 - 40, 9.75, t, { size: 50, cps: 24 });
    typed('HIS TAPE CAME IN THE MAIL.', W / 2, H / 2 + 36, 10.35, t, { size: 50, cps: 26 });
    finishVHS(t, { grainAmt: 0.2, track: 0.6 });
  }
